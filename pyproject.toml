[project]
name = "au-econ"
version = "0.0.0"
description = "Capture and plot data from the ABS and the RBA"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # - system
    "typing",
    # - bespoke
    "readabs",
    "mgplot",
    "sdmxabs",
    # - data science
    "matplotlib",
    "numpy",
    "pandas",
    "pyarrow",
    "openpyxl",
    "xlrd",
    "statsmodels",
    "seaborn",
    "babel",
    "pycountry",
    "yfinance",
    #"pmdarima",  # --- problematic
    # - internet
    "requests",
    "bs4",
    "lxml",
    "html5lib",
    "webdriver_manager",
    "selenium",
    "playwright",
    # - code
    "black",
    "pylint",
    "ruff",
    "mypy",
    # - typing
    "pandas-stubs",
    "numpy-typing",
    "types-selenium",
    "types-seaborn",
    "types-tabulate",
    "curl-cffi>=0.15.0",
    "defusedxml>=0.7.1",
    "types-defusedxml>=0.7.0.20260504",
]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.ruff]
line-length=115
src = ["src", "."]
# ruff 0.17 formats Python blocks in Markdown; the docs' examples keep their hand-aligned comments
format.exclude = ["*.md"]
lint.select = [ "ALL" ]  # Aggresively select all rules
lint.ignore = [
    # --- general rules to ignore
    "COM812",  # missing or trailing comma - recommended by ruff format
    "CPY001",  # missing copyright notice - no file here carries one; ruff 0.16
               # stabilised this rule out of preview, so "ALL" began selecting it
    "D203",    # Incorrect blank line before class - recommended by ruff check
    "D213",    # Multi-line docstring summary should start at the first line - recommended by ruff
    "EM101",   # Exception must not use a string literal
    "EM102",   # Exception must not use an f-string literal
    "T201",    # Remove `print` --> But I use print to alert the user
    "TRY003",  # Long exception messages.
    "FBT003",  # Boolean positional value - inherent to ReqsTuple design
    "PD008",   # mypy doesnt like .loc[] / ruff doesn't like .at[]
    "ANN401",  # Any in **kwargs - correct when forwarding kwargs to readabs
    "BLE001",  # catch-all exceptions - the runner reports any chart failure and carries on
    "INP001",  # implicit-namespace-package - tools/ holds standalone scripts, not a package
    "PLR0913", # Too many arguments - chart helpers take many plotting options
]
# deliberate economics notation: α (capital share) and × (multiplication)
lint.allowed-confusables = ["α", "×"]

# typed stubs for third-party packages that ship none (yfinance)
[tool.mypy]
mypy_path = "stubs"

